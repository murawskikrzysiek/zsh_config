# tmux for this setup: real panes in terminals that have none — Apple's
# Terminal.app splits only the view of one session — plus sessions that
# survive a closed window or a dropped ssh.
#
# install.sh tmux symlinks this to ~/.config/tmux/tmux.conf.

# ── Prefix ───────────────────────────────────────────────────────────────────
# Left at the default C-b deliberately. The popular C-a alternative collides
# with beginning-of-line, which this setup leans on hard: Terminal.app cannot
# map Command at all, so Ctrl+A is the only way to jump to the start of a line
# there. To switch anyway, uncomment:
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# ── Truecolor ────────────────────────────────────────────────────────────────
# Without this tmux quantizes the palette back to 256 colors and the headroom
# theme comes out wrong — the one tmux setting that actually matters here.
# tmux-256color also carries italics; older macOS ships without that terminfo
# entry, hence the fallback.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ",*:RGB"
# tmux older than 3.2 wants this instead of terminal-features:
# set -ga terminal-overrides ",*256col*:Tc"

# ── Responsiveness ───────────────────────────────────────────────────────────
# The default 500ms escape-time swallows ESC-prefixed sequences — exactly the
# ones zsh/keybindings.zsh uses for word motion (ESC b / ESC f) — and lags vim.
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on

# ── Panes ────────────────────────────────────────────────────────────────────
# Cmd+D cannot reach tmux: macOS takes Command before the terminal sees it.
# So splits live on the prefix. | and - mirror the split direction; both keep
# the current directory, as does a new window.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# tmux's own split keys do not inherit the directory; make them behave the
# same so it does not matter which pair you reach for.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# Arrows to move, shifted arrows to resize. -r repeats, so a burst of moves
# needs the prefix only once. Letter bindings are left alone, which keeps
# prefix+l as last-window.
bind -r Left  select-pane -L
bind -r Right select-pane -R
bind -r Up    select-pane -U
bind -r Down  select-pane -D
bind -r S-Left  resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up    resize-pane -U 5
bind -r S-Down  resize-pane -D 5

# Windows numbered from 1: the keyboard is laid out that way, and closing one
# renumbers the rest so the digits stay meaningful.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Mouse and clipboard ──────────────────────────────────────────────────────
# Click to focus a pane, drag borders to resize, scroll into the history.
set -g mouse on
# OSC 52, so a copy inside tmux reaches the Mac clipboard even over ssh. In
# Ghostty this is what clipboard-write = allow permits.
set -g set-clipboard on
# A mouse selection goes straight to the clipboard, iTerm2 style.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── Misc ─────────────────────────────────────────────────────────────────────
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Colors, generated from palettes.py by tmux/make_tmux.py.
source-file -q ~/.config/tmux/headroom.tmux
